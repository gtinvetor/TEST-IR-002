<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Private Investment Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #020617;
      padding: 32px;
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,.5);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      background: #2563eb;
      border: none;
      padding: 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    .error {
      color: #f87171;
      font-size: 13px;
      margin-top: 10px;
    }

    .success {
      color: #4ade80;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Private Investment Platform</h1>
    <p>ثبت درخواست سرمایه‌گذاری (بدون ثبت‌نام)</p>

    <input id="full_name" type="text" placeholder="نام و نام خانوادگی" />
    <input id="email" type="email" placeholder="Email" />
    <input id="amount" type="number" placeholder="مبلغ مورد نظر (USD)" />
    <textarea id="message" placeholder="توضیحات (اختیاری)"></textarea>

    <button onclick="submitRequest()">ارسال درخواست</button>

    <div id="msg"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    // 🔑 تنظیمات Supabase
    const SUPABASE_URL = 'https://inhzkeenvlyryihmfpnu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImluaHprZWVudmx5cnlpaG1mcG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjcyNjQzMzgsImV4cCI6MjA4Mjg0MDMzOH0.LePtjr_KA_IKQ38RitiMFUlCnb94ZLPsgrmdJcwOVJk';

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function submitRequest() {
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const amount = document.getElementById('amount').value;
      const message = document.getElementById('message').value.trim();
      const msg = document.getElementById('msg');

      msg.innerHTML = '';

      if (!full_name || !email || !amount) {
        msg.innerHTML = '<div class="error">نام، ایمیل و مبلغ الزامی است</div>';
        return;
      }

      const { error } = await sb
        .from('investments')
        .insert({
          full_name,
          email,
          amount,
          message
        });

      if (error) {
        console.error(error);
        msg.innerHTML = '<div class="error">خطا در ثبت درخواست</div>';
        return;
      }

      msg.innerHTML = '<div class="success">درخواست با موفقیت ثبت شد</div>';

      document.getElementById('full_name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('message').value = '';
    }
  </script>
</body>
</html>
